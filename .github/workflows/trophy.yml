name: Update GitHub Trophies

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  trophy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Trophies
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: 007-SARANG
          output_path: assets/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: onedark

      - name: Commit Trophy
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/trophy.svg

          git diff --cached --quiet || git commit -m "chore: update GitHub trophies"

          git push
