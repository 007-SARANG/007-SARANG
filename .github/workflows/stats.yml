name: Update GitHub Stats

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          username: 007-SARANG
          output: assets/github-stats.svg
          theme: radical
          hide_border: true
          show_icons: true

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          username: 007-SARANG
          type: top-langs
          output: assets/top-languages.svg
          layout: compact
          theme: radical
          hide_border: true

      - name: Commit GitHub Stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.svg assets/top-languages.svg

          git diff --cached --quiet || git commit -m "chore: update GitHub stats"

          git push
